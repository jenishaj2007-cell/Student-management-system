<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="wrapper">
      <aside class="sidebar">
        <h3 class="brand">📚 Student Hub</h3>
        <nav>
          {% if session.get('user_role') == 'admin' %}
            <a href="{{ url_for('admin_dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{{ url_for('admin_students') }}"><i class="bi bi-people"></i> Students</a>
            <a href="{{ url_for('admin_attendance') }}"><i class="bi bi-calendar-check"></i> Attendance</a>
            <a href="{{ url_for('admin_fees') }}"><i class="bi bi-cash-stack"></i> Fees</a>
          {% else %}
            <a href="{{ url_for('student_dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{{ url_for('student_attendance') }}"><i class="bi bi-calendar3"></i> Attendance</a>
            <a href="{{ url_for('student_fees') }}"><i class="bi bi-receipt"></i> Fees</a>
            <a href="{{ url_for('student_announcements') }}"><i class="bi bi-megaphone"></i> Announcements</a>
            <a href="{{ url_for('student_profile') }}"><i class="bi bi-person-circle"></i> Profile</a>
          {% endif %}
          <a href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </nav>
      </aside>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
