{% extends 'base.html' %}
{% block content %}
<div class="mb-4"><h2 class="fw-bold">Announcements</h2><p class="text-muted">Stay updated with recent campus notices.</p></div>
<div class="card p-4">
  {% for announcement in announcements %}
    <div class="border rounded p-3 mb-3">
      <strong>{{ announcement.title }}</strong>
      <div class="text-muted small">{{ announcement.created_at }}</div>
      <div class="mt-2">{{ announcement.message }}</div>
    </div>
  {% endfor %}
</div>
{% endblock %}
